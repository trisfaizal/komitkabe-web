<html lang="id" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/webp" href="/assets/light-logo.webp" />
    <title>KOMITKABE - Komunitas IT Kawasan Industri</title>
    <meta name="description" content="Komunitas IT Kawasan Industri (Bekasi, Cikarang, Karawang & sekitarnya). Connecting people. Sharing knowledge. Building the future." />
    <meta property="og:title" content="KOMITKABE - Komunitas IT Kawasan Industri" />

    <!-- Google Fonts Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Anti-FOUC Theme Initialization Script -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme') || 'auto';
          const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (theme === 'auto' && systemPrefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 dark:bg-dark-bg dark:text-slate-100 min-h-screen font-sans selection:bg-brand-navy selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
