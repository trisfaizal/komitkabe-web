<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="komitkabe-navy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <!-- Circle Emblem Background -->
  <circle cx="32" cy="32" r="31" fill="url(#komitkabe-navy-grad)"/>

  <!-- Left/Top Red Accent Arc (Official KOMITKABE Crescent Ring) -->
  <path d="M 13 42 A 23 23 0 0 1 38 9" fill="none" stroke="#E11D48" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Monogram Letter K (Vertical Stem) -->
  <rect x="19" y="17" width="6" height="30" rx="1.5" fill="#FFFFFF"/>

  <!-- Upper Diagonal Arm -->
  <polygon points="23,33 37,17 44,17 27,36" fill="#FFFFFF"/>

  <!-- Lower Diagonal Arm -->
  <polygon points="25,31 43,47 36,47 22,35" fill="#FFFFFF"/>

  <!-- Red Accent Dot on Upper Arm Tip -->
  <circle cx="44" cy="17" r="3" fill="#E11D48"/>
</svg>
